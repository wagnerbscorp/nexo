.distribution-panel-hint { color:var(--text-subtle); font-size:11px; margin:7px 0 0; }

.distribution-legend { display:grid; flex:1; gap:17px; min-width:0; }
.distribution-legend > div { display:grid; grid-template-columns:7px minmax(0,1fr) auto; align-items:center; gap:9px; color:var(--text-secondary); font-size:11px; }
.distribution-legend strong { color:var(--text); font-size:13px; font-variant-numeric:tabular-nums; }
.distribution-matrix { margin-bottom:24px; }
.distribution-matrix-head { flex-wrap:wrap; }
.distribution-matrix .segmented { flex-wrap:wrap; }
.distribution-help { margin:0; padding:0 22px 16px; color:var(--text-subtle); font-size:11px; line-height:1.7; }
.distribution-table { min-width:750px; }
.distribution-table th:first-child { min-width:210px; }
.distribution-table td:not(:first-child), .distribution-table th:not(:first-child) { text-align:center; }
.distribution-table .user-identity { display:flex; align-items:center; justify-content:flex-start; gap:12px; min-width:190px; }
.distribution-table td:first-child, .distribution-table th:first-child { text-align:left; }
.distribution-table .user-identity-text small { font-size:10px; }
.distribution-table .distribution-cell.has-value { color:var(--accent); font-weight:650; }
.distribution-table tfoot th { background:var(--surface-soft); border-top:1px solid var(--line); color:var(--text); }
.distribution-history .distribution-result { font-size:11px; color:var(--text-secondary); min-width:220px; max-width:450px; white-space:normal; line-height:1.6; }
.distribution-dialog { width:min(780px,calc(100vw - 40px)); }
.distribution-modal-content { display:grid; gap:16px; }

.distribution-modal-stats > div { display:grid; gap:5px; padding:13px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface-soft); text-align:center; }
.distribution-modal-stats strong { font-size:24px; font-weight:650; letter-spacing:-.7px; font-variant-numeric:tabular-nums; }
.distribution-modal-stats small { font-size:10px; color:var(--text-subtle); }
.distribution-modal-content .section-label { margin:2px 0 -7px; }
.distribution-modal-content .section-label.spaced { margin-top:7px; }
.distribution-mode { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.distribution-mode > label { display:flex; gap:10px; padding:14px 11px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); }
.distribution-mode > label:has(input:checked) { background:var(--accent-soft); border-color:var(--accent-line); }
.distribution-mode input { accent-color:var(--accent); margin-top:2px; align-self:flex-start; }
.distribution-mode span { display:grid; gap:6px; }
.distribution-mode strong { font-size:11px; line-height:1.4; }
.distribution-mode small { font-size:10px; line-height:1.6; color:var(--text-subtle); }
.distribution-users { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); max-height:208px; gap:8px; overflow-y:auto; }
.distribution-user { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); cursor:pointer; min-width:0; }

.distribution-no-items { margin:0; color:var(--text-subtle); font-size:11px; }
@media (max-width:750px) {
 .distribution-intro { align-items:flex-start; flex-direction:column; padding:16px; }

 .distribution-dialog { width:calc(100vw - 24px); }

        function baseRankings(rows) {

        function treatmentPagination(treated, total) {

        /* Distribuição: o campo Base responsável pertence à remessa, nunca ao cadastro. */

              openUserForm(); break;
            case "edit-user":
              openUserForm(b.dataset.id); break;
            case "toggle-user":
              toggleUser(b.dataset.id); break;
            case "delete-user":
              deleteUser(b.dataset.id); break;
            case "export-users":
              exportUsersCsv(); break;
            case "reload-users":
              reloadUsers(); break;
            case "clear-users-filters":
              Object.assign(usersUi, {query: "", role: "", status: "", page: 1}); render(); break;
            case "users-prev":
              usersUi.page = Math.max(1, usersUi.page - 1); render(); break;
            case "users-next":
              usersUi.page++; render(); break;
            case "toggle-theme":
              toggleTheme();
              break;
            case "toggle-nav":
              ui.navOpen = !ui.navOpen;
              render();
              break;
            case "toggle-dates":
              ui.dates = !ui.dates;
              render();
              break;
            case "clear":
              clear();
              break;
            case "clear-data":
              openClearData();
              break;
            case "confirm-clear-data":
              clearData();
              break;
            case "set-case-status":
              requestCaseDecision(b.dataset.id, v);
              break;
            case "draft-status":
              requestCaseDecision(drawerId, v, "draft");
              break;
            case "source-order":
              ui.sort = "";
              ui.dir = 1;
              ui.page = 1;
              ui.treatedPage = 1;
              render();
              break;
            case "status":
              ui.status = ui.status === v ? "" : v;
              ui.page = 1;
              ui.treatedPage = 1;
              render();
              break;
            case "treated-status": {
              if (!["Aceito", "Contestado"].includes(v)) break;
              const state = filterState("treated");
              if (state.columnFilters[F.status]?.length === 1 && state.columnFilters[F.status][0] === v)
                delete state.columnFilters[F.status];
              else state.columnFilters[F.status] = [v];
              ui.treatedPage = 1;
              render();
              break;
            }
            case "base": {
              const key =
                v === "Não informada" && !unique(F.base).includes(v) ? "__missing_base__" : v;
              ui.base = ui.base === key ? "" : key;
              ui.page = 1;
              ui.treatedPage = 1;
              render();
              break;
            }
            case "ranking-base":
              ui.base = v;
              ui.status = b.dataset.status;
              ui.page = 1;
              ui.treatedPage = 1;
              render();
              break;
            case "bar-metric":
              ui.barMetric = v;
              render();
              break;
            case "sort":
              if (ui.sort === v) ui.dir *= -1;
              else {
                ui.sort = v;
                ui.dir = 1;
              }
              ui.page = 1;
              ui.treatedPage = 1;
              render();
              break;
            case "page":
              ui.page = Number(v);
              render();
              break;
            case "treated-page":
              ui.treatedPage = Number(v);
              render();
              break;
            case "copy-shipment":
              copyShipment(v, b.closest("tr[data-case-id]")?.dataset.caseId);
              break;
            case "case":
              openCase(b.dataset.id);
              break;
            case "close-drawer":
              closeDrawer();
              break;
            case "drawer-tab":
              captureDrawer();
              drawerTab = v;
              renderDrawer();
              break;
            case "original":
              drawerOriginal = v === "original";
              renderDrawer();
              break;
            case "save-case":
              saveCase();
              break;
            case "deselect":
              ui.selected.clear();
              render();
              break;
            case "import":
              openImport();
              break;
            case "choose-file":
              document.getElementById(b.dataset.target)?.click();
              break;
            case "confirm-import":
              confirmImport();
              break;
            case "restore":
              if (pendingBackup) {
                if (commit(C.clone(pendingBackup), "Backup restaurado.")) {
                  if (Array.isArray(pendingBackup.userRegistry)) {
                    const restored = validatedUsers(pendingBackup.userRegistry)
                      .filter((u) => u.id !== INITIAL_ADMIN_ID && u.username !== INITIAL_ADMIN_USERNAME && u.role !== "Administrador");
                    const mainAdmin = users.find((u) => u.id === INITIAL_ADMIN_ID);
                    saveUsers([mainAdmin, ...restored], "Cadastro de usuários restaurado. Administrador principal preservado.");
                  }
                  closeModal();
                  ui.selected.clear();
                  clear();
                  pendingBackup = null;
                }
              }
              break;
            case "export":
              openExport();
              break;
            case "download-xlsx":
              downloadXlsx();
              break;
            case "backup":
              backup();
              break;
            case "html":
              portableHtml();
              break;
            case "close-modal":
              closeModal();
              break;
            case "undo":
              if (undoDb) {
                const previous = undoDb;
                undoDb = null;
                if (commit(previous, "Última alteração desfeita.", false)) render();
              }
              break;
            case "toast-close":
              $("#toast-region").innerHTML = "";
              clearTimeout(toastTimer);
              break;
            case "reload-data":
              try {
                const stored = localStorage.getItem(STORAGE);
                if (!stored) throw Error("A base foi removida em outra aba. Importe seu backup.");
                db = C.validateBackup(JSON.parse(stored));
                lastSerialized = stored;
                externalChanged = false;
                storageHealthy = true;
                ui.selected.clear();
                render();
                toast("Dados recarregados.");
              } catch (err) {
                toast(err.message, true);
              }
              break;
          }
        });
        document.addEventListener("paste", (event) => {
          if (!currentUser()) return;
          const input = event.target;
          if (!input.matches("#search, #column-filter-search")) return;
          const text = event.clipboardData?.getData("text");
          if (!text || !/[\r\n]/.test(text)) return;
          event.preventDefault();
          input.setRangeText(text.replace(/\r\n?|\n/g, ", "), input.selectionStart ?? 0, input.selectionEnd ?? input.value.length, "end");
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        document.addEventListener("input", (event) => {
          if (!currentUser()) return;
          if (event.target.id === "column-filter-search" && columnFilterDraft) {
            columnFilterDraft.query = event.target.value;
            renderColumnFilterOptions();
            return;
          }
          if (event.target.id === "column-filter-min" || event.target.id === "column-filter-max") {
            $("#column-filter-error").textContent = "";
            return;
          }
          if (event.target.id === "user-search") {
            usersUi.query = event.target.value;
            usersUi.page = 1;
            render();
            return;
          }
          if (event.target.id === "search") {
            ui.q = event.target.value;
            ui.page = 1;
            ui.treatedPage = 1;
            render();
          }
        });
        document.addEventListener("change", (event) => {
          if (!currentUser()) return;
          const el = event.target;
          if (el.dataset.columnOption !== undefined && columnFilterDraft) {
            const value = columnFilterDraft.values[Number(el.dataset.columnOption)];
            if (value !== undefined) {
              columnFilterDraft.selectionChanged = true;
              if (el.checked) columnFilterDraft.selected.add(value);
              else columnFilterDraft.selected.delete(value);
              updateColumnFilterSummary();
            }
            return;
          }
          if (distributionDraft && el.dataset.distributionUser !== undefined) {
            if (el.checked) distributionDraft.ids.add(el.dataset.distributionUser);
            else distributionDraft.ids.delete(el.dataset.distributionUser);
            renderDistributionModal();
            return;
          }
          if (distributionDraft && el.name === "distribution-mode") {
            distributionDraft.mode = el.value;
            renderDistributionModal();
            return;
          }
          if (el.id === "user-filter-role" || el.id === "user-filter-status") {
            usersUi[el.id === "user-filter-role" ? "role" : "status"] = el.value;
            usersUi.page = 1;
            render();
            return;
          }
          if (el.id === "users-page-size") {
            usersUi.size = Number(el.value);
            usersUi.page = 1;
            render();
            return;
          }
          if (el.dataset.filter) {
            updateFilter(el.dataset.filter, el.value);
            return;
          }
          if (el.classList.contains("file-input")) {
            loadFile(el.files[0]);
            el.value = "";
            return;
          }
          if (el.id === "import-sheet") {
            importSheet = el.value;
            prepareSelectedSheet();
            renderImportPreview();
            return;
          }
          if (el.name === "import-mode") {
            importMode = el.value;
            return;
          }
          if (el.id === "page-size") {
            ui.size = Number(el.value);
            ui.page = 1;
            ui.treatedPage = 1;
            render();
            return;
          }
          if (el.id === "treated-page-size") {
            ui.treatedSize = Number(el.value);
            ui.treatedPage = 1;
            render();
            return;
          }
          if (el.dataset.select) {
            el.checked ? ui.selected.add(el.dataset.select) : ui.selected.delete(el.dataset.select);
            render();
            return;
          }
          if (el.id === "select-page") {
            const rows = pendingRows().slice((ui.page - 1) * ui.size, ui.page * ui.size);
            for (const c of rows) el.checked ? ui.selected.add(c.id) : ui.selected.delete(c.id);
            render();
          }
        });
        document.addEventListener("submit", (event) => {
          if (event.target.id === "login-form") { event.preventDefault(); submitLogin(event.target); return; }
          if (!currentUser()) { event.preventDefault(); return; }
          if (event.target.id === "user-form" && !isAdministrator()) { event.preventDefault(); return; }
          if (event.target.id === "user-form") {
            event.preventDefault();
            saveUserForm(event.target);
          }
          if (event.target.id === "case-form") {
            event.preventDefault();
            saveCase();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (!currentUser()) return;
          if (event.key === "Escape" && !document.querySelector("dialog[open]")) {
            if (ui.expandedTable || ui.navOpen) { ui.expandedTable = ""; ui.navOpen = false; render(); }
          }
          if (event.target.closest(".drawer-tabs") && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
            event.preventDefault();
            const tabs = ["treatment", "full", "history"], index = tabs.indexOf(drawerTab);
            captureDrawer();
            drawerTab = tabs[event.key === "Home" ? 0 : event.key === "End" ? 2 : (index + (event.key === "ArrowRight" ? 1 : 2)) % 3];
            renderDrawer();
            document.getElementById("drawer-tab-" + drawerTab)?.focus();
            return;
          }
          if (event.key === "Enter" && columnFilterDraft &&
            event.target.matches("#column-filter-search, #column-filter-min, #column-filter-max")) {
            event.preventDefault();
            applyColumnFilter();
            return;
          }
          const zone = event.target.closest(".import-zone");
          if (zone && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            document.getElementById(zone.dataset.target)?.click();
          }
        });
        document.addEventListener("dragover", (event) => {
          const zone = event.target.closest(".import-zone");
          if (zone) {
            event.preventDefault();
            zone.classList.add("dragging");
          }
        });
        document.addEventListener("dragleave", (event) => {
          event.target.closest(".import-zone")?.classList.remove("dragging");
        });
        document.addEventListener("drop", (event) => {
          const zone = event.target.closest(".import-zone");
          if (zone) {
            event.preventDefault();
            zone.classList.remove("dragging");
            if (event.dataTransfer.files.length !== 1) {
              toast("Selecione um arquivo por vez.", true);
              return;
            }
            loadFile(event.dataTransfer.files[0]);
          }
        });
        $("#confirm-dialog").addEventListener("cancel", (event) => {
          event.preventDefault(); finishConfirmation(false);
        });
        $("#drawer").addEventListener("cancel", (event) => {
          event.preventDefault();
          closeDrawer();
        });
        $("#column-filter").addEventListener("cancel", (event) => {
          event.preventDefault();
          closeColumnFilter();
        });
        $("#column-filter").addEventListener("click", (event) => {
          if (event.target === $("#column-filter")) {
            const rect = event.target.getBoundingClientRect();
            if (event.clientX < rect.left || event.clientX > rect.right ||
              event.clientY < rect.top || event.clientY > rect.bottom) closeColumnFilter();
          }
        });
        window.addEventListener("resize", positionColumnFilter);
        window.addEventListener("scroll", positionColumnFilter, true);
        $("#modal").addEventListener("close", () => {
          distributionDraft = null;
          $("#modal").classList.remove("distribution-dialog");
        });
        $("#modal").addEventListener("click", (event) => {
          if (event.target === $("#modal")) {
            const r = $("#modal").getBoundingClientRect();
            if (
              event.clientX < r.left ||
              event.clientX > r.right ||
              event.clientY < r.top ||
              event.clientY > r.bottom
            )
              closeModal();
          }
        });
        window.addEventListener("storage", (event) => {
          if (event.key === USERS_STORAGE && event.newValue !== usersLastSerialized) {
            usersExternalChanged = true;
            // Bloqueia sessoes abertas quando conta/status/senha muda em outra aba.
            try {
              const incoming = withInitialAdministrator(validatedUsers(event.newValue ? JSON.parse(event.newValue) : []));
              const me = currentUser();
              const latest = incoming.find((u) => u.id === authenticatedUserId);
              if (me && (!latest || latest.status !== "Ativo" || latest.passwordHash !== me.passwordHash || latest.role !== me.role || latest.username !== me.username)) {
                users = incoming;
                usersLastSerialized = event.newValue;
                usersExternalChanged = false;
                logOut(); loginError = "A conta foi atualizada. Faça login novamente."; render();
              }
            } catch { users = []; usersStorageHealthy = false; logOut(); loginError = "O cadastro foi alterado. Verifique os dados antes de acessar."; render(); }
            if (ui.view === "users") {
              render();
              toast("Cadastro de usuários alterado em outra aba. Recarregue antes de salvar.", true);
            }
          }
          if (event.key === "nexo-theme-v1") {
            document.documentElement.dataset.theme = event.newValue === "dark" ? "dark" : "light";
            render();
          }
          if (event.key === STORAGE && event.newValue !== lastSerialized) {
            externalChanged = true;
            render();
            toast("A base foi atualizada em outra aba. Recarregue antes de salvar.", true);
          }
        });
        render();
        setInterval(refreshProcessingTimes, 1000);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) refreshProcessingTimes();
        });
        if (!storageHealthy)
          setTimeout(
            () =>
              toast(
                "O armazenamento local não está disponível. Use o backup para guardar o trabalho.",
                true,
              ),
            400,
          );
      })();
    

    </script>
  </body>
</html>
